name: Enterprise WMS CI/CD Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-quality:
    name: Backend Quality Gate (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wms_test
          POSTGRES_USER: wms_user
          POSTGRES_PASSWORD: wms_secure_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WMS_Managment_Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: WMS_Managment_Backend
        run: npm ci

      - name: Backend Typecheck
        working-directory: WMS_Managment_Backend
        run: npx tsc --noEmit

      - name: Run Migrations on Test Database
        working-directory: WMS_Managment_Backend
        env:
          DATABASE_URL: postgresql://wms_user:wms_secure_test_password@localhost:5432/wms_test?sslmode=disable
          JWT_SECRET: super_secure_test_jwt_secret_with_more_than_32_characters
          JWT_REFRESH_SECRET: super_secure_test_jwt_refresh_secret_more_32_chars
          NODE_ENV: test
        run: npm run migrate

      - name: Run Backend Tests
        working-directory: WMS_Managment_Backend
        env:
          DATABASE_URL: postgresql://wms_user:wms_secure_test_password@localhost:5432/wms_test?sslmode=disable
          JWT_SECRET: super_secure_test_jwt_secret_with_more_than_32_characters
          JWT_REFRESH_SECRET: super_secure_test_jwt_refresh_secret_more_32_chars
          NODE_ENV: test
        run: npm test

      - name: Backend Build
        working-directory: WMS_Managment_Backend
        run: npm run build

  frontend-quality:
    name: Frontend Quality Gate (Typecheck, Vitest, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WMS_Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: WMS_Frontend
        run: npm ci

      - name: Frontend Typecheck
        working-directory: WMS_Frontend
        run: npx tsc -b

      - name: Run Frontend Tests
        working-directory: WMS_Frontend
        run: npm test

      - name: Frontend Production Build
        working-directory: WMS_Frontend
        run: npm run build

  docker-build:
    name: Docker Production Image Build
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./WMS_Managment_Backend
          push: false
          tags: wms-backend:latest
